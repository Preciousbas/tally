name: Add to DevRel Tracker
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: https://github.com/orgs/midnightntwrk/projects/75
          github-token: ${{ secrets.DEVREL_TRACKER_TOKEN }}
