<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-label="Tally X header">
  <title>Tally</title>
  <rect width="1500" height="500" fill="#1C1914"/>
  <rect x="0" y="498" width="1500" height="2" fill="#8C2F2B"/>
  <!-- faint stick mark left -->
  <g transform="translate(80,90) scale(1.8)" opacity="0.9">
    <rect x="10" y="8" width="12" height="144" rx="2" fill="#C4B49A"/>
    <rect x="26" y="8" width="12" height="144" rx="2" fill="#A89478"/>
    <rect x="22" y="8" width="4" height="144" fill="#1C1914"/>
    <g stroke="#1C1914" stroke-width="2" stroke-linecap="round">
      <line x1="10" y1="36" x2="22" y2="36"/>
      <line x1="26" y1="36" x2="38" y2="36"/>
      <line x1="10" y1="60" x2="22" y2="60"/>
      <line x1="26" y1="60" x2="38" y2="60"/>
      <line x1="10" y1="84" x2="22" y2="84"/>
      <line x1="26" y1="84" x2="38" y2="84"/>
      <line x1="10" y1="108" x2="22" y2="108"/>
      <line x1="26" y1="108" x2="38" y2="108"/>
      <line x1="10" y1="132" x2="22" y2="132"/>
      <line x1="26" y1="132" x2="38" y2="132"/>
    </g>
  </g>
  <text x="220" y="240" fill="#E8DCC8" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="600">Tally</text>
  <text x="220" y="310" fill="#C4B49A" font-family="system-ui, sans-serif" font-size="36">The other half stays private.</text>
</svg>
